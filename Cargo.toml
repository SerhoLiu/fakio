[package]
name = "fakio"
version = "0.3.0"
authors = ["Serho Liu <serholiu@gmail.com>"]
edition = "2018"

[lib]
name = "fakio"

[[bin]]
name = "fakio-client"
path = "src/bin/client.rs"

[[bin]]
name = "fakio-server"
path = "src/bin/server.rs"

[dependencies]
log = "0.4"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
ansi_term = "0.12"
env_logger = "0.11"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
ring = "0.17"
rand = "0.10"
toml = "1.2"
serde = "1.0"
serde_derive = "1.0"
dirs = "7.0"
